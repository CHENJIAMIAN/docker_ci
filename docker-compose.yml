version: '3.1'
services:
  backend-service:
      container_name: backend-service
      #构建容器
      build: ./backend
      #直接从git拉去
      # build: git@github.com:su37josephxia/docker_ci.git#:backend
      # 需要链接本地代码时
      # volumes:
      #   - ./backend:/usr/src/app
      ports:
        - "8801:8801"
  mongo:
    image: mongo
    restart: always
    ports:
      - 8802:27017
  # mongo-express:
  #   image: mongo-express
  #   restart: always 
  #   ports:
  #     - 8081:8081
  nginx:
    restart: always
    image: nginx
    ports:
      - 8091:80
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d
      - ./frontend/dist:/var/www/html/
      - ./static/:/static/